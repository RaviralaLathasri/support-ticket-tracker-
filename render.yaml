services:
  # 1. FastAPI Backend Web Service (100% Free Plan)
  - type: web
    name: support-ticket-tracker-api
    plan: free
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./support_tickets.db
      - key: GEMINI_API_KEY
        sync: false

  # 2. React Vite Frontend Static Site (100% Free CDN)
  - type: web
    name: support-ticket-tracker-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: support-ticket-tracker-api
          property: host
    routes:
      # Redirect all fallback SPA paths to index.html for React Router
      - type: rewrite
        source: /*
        destination: /index.html
